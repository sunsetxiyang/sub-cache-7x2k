name: merge-sub

on:
  push:
    paths: ["A/**", "B/**"]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run merge script
        run: bash merge.sh
      - name: Commit merged subscription
        run: |
          git config user.name "sub-merge"
          git config user.email "sub-merge@users.noreply.github.com"
          git add links.txt v2ray clash.yaml
          git diff --cached --quiet || git commit -m "auto-merge subscription"
          git push
